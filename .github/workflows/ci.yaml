name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Exercise the same source validator with GitHub's actual runtime identity.
  # This local helper may come from a PR, so give it no permissions or secrets.
  pr-review-source:
    needs: security-scan
    if: github.repository == 'luckyPipewrench/pipelock'
    permissions: {}
    uses: ./.github/workflows/pr-review-source.yaml

  # Pipelock scans the PR diff before anything else runs. If the scan
  # finds credential leaks, injection patterns, or security misconfigs,
  # all downstream jobs are skipped — no compromised code executes.
  #
  # The scanner is BUILT FROM THE DEFAULT BRANCH rather than downloaded as a
  # release. A released binary is frozen at the last tag, so a scanner fix on
  # main did not reach this gate until the next release shipped. That was not
  # theoretical: the whole-file-deletion hunk fix in #1145 sat on main while the
  # released binary rejected every deletion-bearing pull request with
  # "unverifiable input: content outside unified diff hunks" and surfaced it as
  # "Secrets detected in PR diff" with no secret present.
  #
  # Building from origin/main rather than from the pull request head also means
  # a pull request cannot supply the scanner that inspects it.
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: false

      - name: Build scanner from origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          main_sha=$(git rev-parse FETCH_HEAD)
          echo "building scanner from origin/main ${main_sha}"
          build_tree="${RUNNER_TEMP}/trusted-main"
          git worktree add --detach "${build_tree}" "${main_sha}"
          ( cd "${build_tree}" && go build -o "${RUNNER_TEMP}/pipelock" ./cmd/pipelock )
          "${RUNNER_TEMP}/pipelock" --version

      - name: Verify diff generation
        # Run the generator's tests from the TRUSTED worktree, not the pull
        # request checkout. A pull request that supplied its own copy of these
        # scripts could emit an empty diff and pass a scan that read nothing.
        run: bash "${RUNNER_TEMP}/trusted-main/scripts/test-generate-trusted-diff.sh" "${RUNNER_TEMP}/pipelock"

      - name: Scan the diff
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [[ -z "${BASE_SHA}" || -z "${HEAD_SHA}" || "${BASE_SHA}" == "${zero_sha}" || "${HEAD_SHA}" == "${zero_sha}" ]]; then
            echo "refusing to scan an empty or all-zero diff endpoint" >&2
            exit 1
          fi
          git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null || {
            echo "refusing to scan: base is not an available commit: ${BASE_SHA}" >&2
            exit 1
          }
          git rev-parse --verify --quiet "${HEAD_SHA}^{commit}" >/dev/null || {
            echo "refusing to scan: head is not an available commit: ${HEAD_SHA}" >&2
            exit 1
          }
          merge_base=$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")
          diff_file="${RUNNER_TEMP}/pr.diff"
          # Added-line scope for normal text, full new-side blob only where
          # attributes or Git's binary heuristic hide the patch.
          bash "${RUNNER_TEMP}/trusted-main/scripts/generate-trusted-diff.sh" \
            "${merge_base}" "${HEAD_SHA}" "${diff_file}"

          "${RUNNER_TEMP}/pipelock" git scan-diff \
            --exclude internal/scanner/scanner_test.go \
            --exclude internal/scanner/scan_env_test.go \
            --exclude internal/scanner/text_dlp_test.go \
            --exclude internal/scanner/validate_test.go \
            --exclude internal/proxy/intercept_test.go \
            --exclude internal/proxy/session_api.go \
            --exclude internal/cli/support/bundle_test.go \
            --exclude 'enterprise/licenseservice/*_test.go' \
            --exclude test/secureiqlab/ \
            --exclude README.md \
            --exclude assets/demo.cast \
            --exclude .github/actions/pr-review/pr_review.py \
            --exclude docs/attacks-blocked.md \
            --exclude docs/bypass-resistance.md \
            --exclude docs/configuration.md \
            --exclude docs/scan-api.md \
            --exclude docs/guides/deployment-recipes.md \
            --exclude docs/guides/tls-interception.md \
            --exclude docs/guides/zed.md \
            --exclude examples/demo-readme.sh \
            --exclude sdk/conformance/testdata/aarp-corpus/ \
            < "${diff_file}"

  # The Go 1.27 race lane is skipped by default (see the producer jobs
  # below), but a PR that changes CI policy, Go pins, or the guard that checks
  # them must still prove both versions before merge -- the whole reason the
  # 1.27 lane is skipped elsewhere is that it never catches anything OTHER
  # than a real toolchain change, and this is exactly that case. Uses a
  # job-level output (not a workflow-level `paths:` trigger filter) because a
  # `paths:`-filtered workflow run is entirely skipped rather than reporting a
  # check, and a skipped workflow leaves a required check permanently pending
  # instead of green.
  changed-files:
    needs: [security-scan]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci_policy: ${{ steps.check.outputs.ci_policy }}
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect CI-policy file changes
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- \
            .github/workflows/ go.mod go.sum scripts/check-go-matrix.sh \
            scripts/ci_test_packages.py scripts/ci_test_durations.json \
            scripts/ci-test-with-retry.sh scripts/run-race-test.sh Makefile codecov.yml)"
          if [ -n "$changed" ]; then
            echo "PR touches CI-policy files:"
            printf '%s\n' "$changed"
            echo "ci_policy=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR touches no CI-policy files"
            echo "ci_policy=false" >> "$GITHUB_OUTPUT"
          fi

      # A pull request that changes only prose skips the Go build, test, lint
      # and platform jobs; docs-check and the config-example job, which read
      # docs/*.md, still run, and main runs everything after merge. A Markdown
      # file is not prose when Go can reach it: a test or embed that names it
      # by path, or a Go package at or above it, since //go:embed globs and
      # directories reach every file below their package without naming it.
      # Anything this classifier cannot prove is prose runs the full suite.
      - name: Detect documentation-only changes
        id: docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          declare -A go_dirs=()
          while IFS= read -r go_file; do
            go_dirs["${go_file%/*}"]=1
          done < <(git ls-tree -r --name-only "$HEAD_SHA" | grep '/.*\.go$' || true)
          docs_only=true
          count=0
          while IFS= read -r -d '' path; do
            count=$((count + 1))
            reason=""
            case "$path" in
              testdata/*|*/testdata/*|.github/*|sdk/*) reason="fixture or tooling path" ;;
              *.md) ;;
              *) reason="not Markdown" ;;
            esac
            if [ -z "$reason" ]; then
              dir="$path"
              while [[ "$dir" == */* ]]; do
                dir="${dir%/*}"
                if [ -n "${go_dirs[$dir]:-}" ]; then
                  reason="inside Go package $dir"
                  break
                fi
              done
            fi
            if [ -z "$reason" ] && git ls-tree --name-only "$HEAD_SHA" | grep -q '\.go$'; then
              reason="the repository root is a Go package"
            fi
            if [ -z "$reason" ]; then
              base="${path##*/}"
              if git grep -q -F -e "$path" -e "$base" "$HEAD_SHA" -- '*.go'; then
                reason="named by Go code"
              fi
            fi
            if [ -n "$reason" ]; then
              echo "full CI: $path ($reason)"
              docs_only=false
              break
            fi
          done < <(git diff -z --name-only "${BASE_SHA}...${HEAD_SHA}")
          if [ "$count" -eq 0 ]; then
            echo "full CI: empty diff"
            docs_only=false
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # Race lane. The race detector multiplies test time by five to eleven, so the
  # full race suite costs about six runner-hours per run. Pull requests get the
  # fast no-race suite below instead; this lane runs on main, in the merge queue,
  # nightly, and on demand. GitHub keeps at most one pending main run per ref, so
  # a burst of merges is proven by one race run against the newest commit.
  # max-parallel leaves most of the account's concurrent-job limit to pull
  # requests, which are waiting on their results; main is not.
  test-oss-go126:
    needs: [security-scan]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    name: race-oss (1.26, ${{ matrix.shard }})
    # Two 21-minute whole-command attempts, kill grace, plus setup and upload.
    timeout-minutes: 48
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ['proxy-0', 'proxy-1', 'proxy-2', 'proxy-3', 'proxy-4', 'scanner-0', 'scanner-1', 'scanner-2', 'mcp-0', 'mcp-1', 'mcp-2', 'mcp-3', 'mcp-4', 'runtime-0', 'runtime-1', 'rest-0', 'rest-1', 'rest-2', 'rest-3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Verify dependencies
        run: bash scripts/ci-retry.sh go mod verify

      - name: Download dependencies
        run: bash scripts/ci-retry.sh go mod download

      - name: Run tests (OSS race)
        env:
          TEST_LABEL: OSS race Go 1.26 ${{ matrix.shard }}
          TEST_SHARD: ${{ matrix.shard }}
          # Advisory test-step budget: warns when a shard drifts so its weights
          # get refreshed. Never fails.
          SHARD_BUDGET_SECONDS: '600'
          # Hard ceiling for one top-level test. The planner places whole
          # top-level tests, so one test this slow overloads its shard; the
          # summarizer fails the shard and names the test to split.
          TEST_CEILING_SECONDS: '300'
        run: |
          set -o pipefail
          set +e
          packages="$(python3 scripts/ci_test_packages.py --shard "$TEST_SHARD")" || exit $?
          # proxy-N and scanner-N run disjoint halves of one package tree's tests.
          test_selector="$(python3 scripts/ci_test_packages.py --shard "$TEST_SHARD" --selector)" || exit $?
          package_parallelism=2
          if [[ "$TEST_SHARD" == proxy-* ]]; then
            # The proxy shard has two race-instrumented packages. Running them
            # sequentially lowers peak memory without serializing t.Parallel
            # tests inside either package.
            package_parallelism=1
          fi
          # Public runners are 4 vCPU, and -race multiplies scheduler pressure.
          # Keep package and intra-package test fan-out below CPU count so
          # deadline/timer tests are not starved by the shard matrix.
          # go test's own -timeout must fire well inside the whole-command
          # attempt deadline: only go test's timeout panic names the test that
          # hung. With a 20m timeout and a 21m attempt, compile time let the
          # attempt deadline win and the shard died without naming anything.
          bash scripts/ci-test-with-retry.sh --packages "$packages" --attempt-timeout-seconds 1260 -- \
            go test -race -p="$package_parallelism" -parallel=2 -timeout=15m -count=1 ${test_selector:+"$test_selector"} -json \
            | python3 scripts/stream_go_test_json.py --label "$TEST_LABEL" --json-out /tmp/go-test-oss.json
          test_status=$?
          python3 scripts/summarize_go_test_json.py --label "$TEST_LABEL" --max-test-seconds "$TEST_CEILING_SECONDS" < /tmp/go-test-oss.json
          summary_status=$?
          if [ "$SECONDS" -gt "$SHARD_BUDGET_SECONDS" ]; then
            echo "::warning title=CI shard over time budget::${TEST_LABEL} took ${SECONDS}s, over the ${SHARD_BUDGET_SECONDS}s budget. Refresh scripts/ci_test_durations.json from the go-test-json artifacts or raise TEST_SPLITS for the tree."
          fi
          if [ "$summary_status" -ne 0 ]; then
            exit "$summary_status"
          fi
          exit "$test_status"

      - name: Upload test timing
        # Raw go test JSON, kept so scripts/ci_test_durations.py can refresh
        # the shard weights from real runner timings.
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-json-oss-go126-${{ matrix.shard }}
          path: /tmp/go-test-oss.json
          retention-days: 14
          if-no-files-found: ignore

  # Fast suite: every test package, no race detector, under both build variants.
  # This is what pull requests wait on. Without -race the same tests run five to
  # eleven times faster (the scanner tree: about 40s against 7m50s), so whole
  # package trees fit one shard and a pull request needs a handful of runners
  # instead of thirty-eight. The race lane above proves the same tests under
  # -race after merge. Coverage comes from this lane: set-mode counters cost
  # little without -race, and every pull request and main push reports it.
  #
  # No retry wrapper here. A timeout is either a hang or a slow test, and both
  # should fail fast with the test named: go test's own timeout panic lists the
  # running tests, and the job limit leaves room for it to fire first.
  test-unit-go126:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    name: test-${{ matrix.variant }} (1.26, ${{ matrix.shard }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: ['oss', 'enterprise']
        # Must equal scripts/ci_test_packages.py --list-unit-shards (UNIT_SPLITS).
        shard: ['proxy-0', 'proxy-1', 'scanner', 'mcp-0', 'mcp-1', 'mcp-2', 'runtime', 'rest-0', 'rest-1', 'rest-2', 'rest-3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Verify dependencies
        run: bash scripts/ci-retry.sh go mod verify

      - name: Download dependencies
        run: bash scripts/ci-retry.sh go mod download

      - name: Run tests (no race)
        env:
          TEST_LABEL: ${{ matrix.variant }} Go 1.26 ${{ matrix.shard }}
          TEST_SHARD: ${{ matrix.shard }}
          VARIANT: ${{ matrix.variant }}
          # One top-level test slower than this, without -race, is a test to
          # split or speed up; the summarizer fails the shard and names it.
          TEST_CEILING_SECONDS: '120'
        run: |
          set -o pipefail
          tags=()
          if [ "$VARIANT" = enterprise ]; then
            tags=(-tags enterprise)
          fi
          # The planner's no-race plan: whole heavy trees or UNIT_SPLITS
          # sub-shards of them, complete and disjoint by construction, and the
          # race lane's rest packing.
          if [ "$VARIANT" = enterprise ]; then
            packages="$(python3 scripts/ci_test_packages.py --tags enterprise --unit-shard "$TEST_SHARD")" || exit $?
          else
            packages="$(python3 scripts/ci_test_packages.py --unit-shard "$TEST_SHARD")" || exit $?
          fi
          test_selector="$(python3 scripts/ci_test_packages.py --unit-shard "$TEST_SHARD" --selector)" || exit $?
          # shellcheck disable=SC2086 # packages is a space-separated list
          go test "${tags[@]}" -p=4 -timeout=8m -count=1 -covermode=set -coverprofile=coverage.out ${test_selector:+"$test_selector"} $packages -json \
            | python3 scripts/stream_go_test_json.py --label "$TEST_LABEL" --json-out /tmp/go-test.json
          test_status=$?
          python3 scripts/summarize_go_test_json.py --label "$TEST_LABEL" --max-test-seconds "$TEST_CEILING_SECONDS" < /tmp/go-test.json
          summary_status=$?
          if [ "$summary_status" -ne 0 ]; then
            exit "$summary_status"
          fi
          exit "$test_status"

      - name: Upload test timing
        # Not named go-test-json-*: the shard drift job reads those as race
        # timings, and no-race seconds would underweight every race shard.
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-json-${{ matrix.variant }}-go126-${{ matrix.shard }}
          path: /tmp/go-test.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify coverage profile
        # Uploading is best-effort telemetry; producing a real profile is not.
        run: bash scripts/check-coverage-profile.sh coverage.out

      - name: Upload coverage
        # Enterprise profiles exclude Apache-only runtime stubs, so both variants
        # upload. Uploader failures are telemetry failures; codecov/* gates
        # coverage, and the Codecov CLI's own key fetch fails intermittently.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  test-oss-go127:
    needs: [security-scan, changed-files]
    # Runs only on pull requests that touch CI policy / Go pins (see the
    # changed-files job). release.yaml proves every shard on the pinned Go 1.27
    # before a tag. Running it on every PR and main push only ever caught timing
    # flakes, never a version-specific failure, while its race jobs were the
    # largest share of runner queue time for every overlapping run.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && github.event_name == 'pull_request' && needs.changed-files.outputs.ci_policy == 'true' }}
    runs-on: ubuntu-latest
    name: race-oss (1.27, ${{ matrix.shard }})
    # Two 21-minute whole-command attempts, kill grace, plus setup and upload.
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        shard: ['proxy-0', 'proxy-1', 'proxy-2', 'proxy-3', 'proxy-4', 'scanner-0', 'scanner-1', 'scanner-2', 'mcp-0', 'mcp-1', 'mcp-2', 'mcp-3', 'mcp-4', 'runtime-0', 'runtime-1', 'rest-0', 'rest-1', 'rest-2', 'rest-3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Verify dependencies
        run: bash scripts/ci-retry.sh go mod verify

      - name: Download dependencies
        run: bash scripts/ci-retry.sh go mod download

      - name: Run tests (OSS)
        env:
          TEST_LABEL: OSS Go 1.27 ${{ matrix.shard }}
          TEST_SHARD: ${{ matrix.shard }}
          # Advisory test-step budget: warns when a shard drifts toward the
          # 15-minute end-to-end goal so its weights get refreshed. Never fails.
          SHARD_BUDGET_SECONDS: '600'
          # Hard ceiling for one top-level test. The planner places whole
          # top-level tests, so one test this slow overloads its shard; the
          # summarizer fails the shard and names the test to split.
          TEST_CEILING_SECONDS: '300'
        run: |
          set -o pipefail
          set +e
          packages="$(python3 scripts/ci_test_packages.py --shard "$TEST_SHARD")" || exit $?
          # proxy-N and scanner-N run disjoint halves of one package tree's tests.
          test_selector="$(python3 scripts/ci_test_packages.py --shard "$TEST_SHARD" --selector)" || exit $?
          package_parallelism=2
          if [[ "$TEST_SHARD" == proxy-* ]]; then
            package_parallelism=1
          fi
          bash scripts/ci-test-with-retry.sh --packages "$packages" --attempt-timeout-seconds 1260 -- \
            go test -race -p="$package_parallelism" -parallel=2 -timeout=15m -count=1 ${test_selector:+"$test_selector"} -json \
            | python3 scripts/stream_go_test_json.py --label "$TEST_LABEL" --json-out /tmp/go-test-oss.json
          test_status=$?
          python3 scripts/summarize_go_test_json.py --label "$TEST_LABEL" --max-test-seconds "$TEST_CEILING_SECONDS" < /tmp/go-test-oss.json
          summary_status=$?
          if [ "$SECONDS" -gt "$SHARD_BUDGET_SECONDS" ]; then
            echo "::warning title=CI shard over time budget::${TEST_LABEL} took ${SECONDS}s, over the ${SHARD_BUDGET_SECONDS}s budget. Refresh scripts/ci_test_durations.json from the go-test-json artifacts or raise TEST_SPLITS for the tree."
          fi
          if [ "$summary_status" -ne 0 ]; then
            exit "$summary_status"
          fi
          exit "$test_status"

      - name: Upload test timing
        # Raw go test JSON, kept so scripts/ci_test_durations.py can refresh
        # the shard weights from real runner timings.
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-json-oss-go127-${{ matrix.shard }}
          path: /tmp/go-test-oss.json
          retention-days: 14
          if-no-files-found: ignore

  test-enterprise-go126:
    needs: [security-scan]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    name: race-enterprise (1.26, ${{ matrix.shard }})
    # Two 21-minute whole-command attempts, kill grace, plus setup and upload.
    timeout-minutes: 48
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ['proxy-0', 'proxy-1', 'proxy-2', 'proxy-3', 'proxy-4', 'scanner-0', 'scanner-1', 'scanner-2', 'mcp-0', 'mcp-1', 'mcp-2', 'mcp-3', 'mcp-4', 'runtime-0', 'runtime-1', 'rest-0', 'rest-1', 'rest-2', 'rest-3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Verify dependencies
        run: bash scripts/ci-retry.sh go mod verify

      - name: Download dependencies
        run: bash scripts/ci-retry.sh go mod download

      - name: Run tests (enterprise race)
        env:
          TEST_LABEL: enterprise race Go 1.26 ${{ matrix.shard }}
          TEST_SHARD: ${{ matrix.shard }}
          # Advisory test-step budget: warns when a shard drifts so its weights
          # get refreshed. Never fails.
          SHARD_BUDGET_SECONDS: '600'
          # Hard ceiling for one top-level test. The planner places whole
          # top-level tests, so one test this slow overloads its shard; the
          # summarizer fails the shard and names the test to split.
          TEST_CEILING_SECONDS: '300'
        run: |
          set -o pipefail
          set +e
          packages="$(python3 scripts/ci_test_packages.py --tags enterprise --shard "$TEST_SHARD")" || exit $?
          # proxy-N and scanner-N run disjoint halves of one package tree's tests.
          test_selector="$(python3 scripts/ci_test_packages.py --shard "$TEST_SHARD" --selector)" || exit $?
          package_parallelism=2
          if [[ "$TEST_SHARD" == proxy-* ]]; then
            # The proxy shard has two race-instrumented packages. Running them
            # sequentially lowers peak memory without serializing t.Parallel
            # tests inside either package.
            package_parallelism=1
          fi
          # Public runners are 4 vCPU, and -race multiplies scheduler pressure.
          # Keep package and intra-package test fan-out below CPU count so
          # deadline/timer tests are not starved by the shard matrix.
          # go test's own -timeout must fire well inside the whole-command
          # attempt deadline: only go test's timeout panic names the test that
          # hung. With a 20m timeout and a 21m attempt, compile time let the
          # attempt deadline win and the shard died without naming anything.
          bash scripts/ci-test-with-retry.sh --packages "$packages" --attempt-timeout-seconds 1260 -- \
            go test -tags enterprise -race -p="$package_parallelism" -parallel=2 -timeout=15m -count=1 ${test_selector:+"$test_selector"} -json \
            | python3 scripts/stream_go_test_json.py --label "$TEST_LABEL" --json-out /tmp/go-test-enterprise.json
          test_status=$?
          python3 scripts/summarize_go_test_json.py --label "$TEST_LABEL" --max-test-seconds "$TEST_CEILING_SECONDS" < /tmp/go-test-enterprise.json
          summary_status=$?
          if [ "$SECONDS" -gt "$SHARD_BUDGET_SECONDS" ]; then
            echo "::warning title=CI shard over time budget::${TEST_LABEL} took ${SECONDS}s, over the ${SHARD_BUDGET_SECONDS}s budget. Refresh scripts/ci_test_durations.json from the go-test-json artifacts or raise TEST_SPLITS for the tree."
          fi
          if [ "$summary_status" -ne 0 ]; then
            exit "$summary_status"
          fi
          exit "$test_status"

      - name: Upload test timing
        # Raw go test JSON, kept so scripts/ci_test_durations.py can refresh
        # the shard weights from real runner timings.
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-json-enterprise-go126-${{ matrix.shard }}
          path: /tmp/go-test-enterprise.json
          retention-days: 14
          if-no-files-found: ignore

  test-enterprise-go127:
    needs: [security-scan, changed-files]
    # Runs only on pull requests that touch CI policy / Go pins (see the
    # changed-files job). release.yaml proves every shard on the pinned Go 1.27
    # before a tag. Running it on every PR and main push only ever caught timing
    # flakes, never a version-specific failure, while its race jobs were the
    # largest share of runner queue time for every overlapping run.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && github.event_name == 'pull_request' && needs.changed-files.outputs.ci_policy == 'true' }}
    runs-on: ubuntu-latest
    name: race-enterprise (1.27, ${{ matrix.shard }})
    # Two 21-minute whole-command attempts, kill grace, plus setup and upload.
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        shard: ['proxy-0', 'proxy-1', 'proxy-2', 'proxy-3', 'proxy-4', 'scanner-0', 'scanner-1', 'scanner-2', 'mcp-0', 'mcp-1', 'mcp-2', 'mcp-3', 'mcp-4', 'runtime-0', 'runtime-1', 'rest-0', 'rest-1', 'rest-2', 'rest-3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Verify dependencies
        run: bash scripts/ci-retry.sh go mod verify

      - name: Download dependencies
        run: bash scripts/ci-retry.sh go mod download

      - name: Run tests (enterprise)
        env:
          TEST_LABEL: enterprise Go 1.27 ${{ matrix.shard }}
          TEST_SHARD: ${{ matrix.shard }}
          # Advisory test-step budget: warns when a shard drifts toward the
          # 15-minute end-to-end goal so its weights get refreshed. Never fails.
          SHARD_BUDGET_SECONDS: '600'
          # Hard ceiling for one top-level test. The planner places whole
          # top-level tests, so one test this slow overloads its shard; the
          # summarizer fails the shard and names the test to split.
          TEST_CEILING_SECONDS: '300'
        run: |
          set -o pipefail
          set +e
          packages="$(python3 scripts/ci_test_packages.py --tags enterprise --shard "$TEST_SHARD")" || exit $?
          # proxy-N and scanner-N run disjoint halves of one package tree's tests.
          test_selector="$(python3 scripts/ci_test_packages.py --shard "$TEST_SHARD" --selector)" || exit $?
          package_parallelism=2
          if [[ "$TEST_SHARD" == proxy-* ]]; then
            package_parallelism=1
          fi
          bash scripts/ci-test-with-retry.sh --packages "$packages" --attempt-timeout-seconds 1260 -- \
            go test -tags enterprise -race -p="$package_parallelism" -parallel=2 -timeout=15m -count=1 ${test_selector:+"$test_selector"} -json \
            | python3 scripts/stream_go_test_json.py --label "$TEST_LABEL" --json-out /tmp/go-test-enterprise.json
          test_status=$?
          python3 scripts/summarize_go_test_json.py --label "$TEST_LABEL" --max-test-seconds "$TEST_CEILING_SECONDS" < /tmp/go-test-enterprise.json
          summary_status=$?
          if [ "$SECONDS" -gt "$SHARD_BUDGET_SECONDS" ]; then
            echo "::warning title=CI shard over time budget::${TEST_LABEL} took ${SECONDS}s, over the ${SHARD_BUDGET_SECONDS}s budget. Refresh scripts/ci_test_durations.json from the go-test-json artifacts or raise TEST_SPLITS for the tree."
          fi
          if [ "$summary_status" -ne 0 ]; then
            exit "$summary_status"
          fi
          exit "$test_status"

      - name: Upload test timing
        # Raw go test JSON, kept so scripts/ci_test_durations.py can refresh
        # the shard weights from real runner timings.
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-json-enterprise-go127-${{ matrix.shard }}
          path: /tmp/go-test-enterprise.json
          retention-days: 14
          if-no-files-found: ignore

  test-subprocess-coverage:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Verify dependencies
        run: bash scripts/ci-retry.sh go mod verify

      - name: Download dependencies
        run: bash scripts/ci-retry.sh go mod download

      - name: Collect sandbox subprocess coverage
        run: bash scripts/coverage-with-subprocess.sh coverage-subprocess.out

      - name: Verify coverage profile
        # Uploading is best-effort telemetry; producing a real profile is not.
        run: bash scripts/check-coverage-profile.sh coverage-subprocess.out

      - name: Upload subprocess coverage
        # Best-effort telemetry; see the Upload coverage step above. A Codecov
        # uploader-integrity hiccup must not red this job when coverage collection
        # itself succeeded.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage-subprocess.out
          fail_ci_if_error: false

  # Four race-enabled Guard conformance invocations, each with its own
  # five-minute timeout. Split from subprocess coverage so neither job waits on
  # the other.
  guard-conformance:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: bash scripts/ci-retry.sh go mod download

      - name: Run Guard hostile-input conformance gate
        run: bash scripts/check-guard-conformance.sh

  test-replay-go126:
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
      - name: Replay harness (deterministic regression)
        run: make test-replay-harness

  test-replay-go127:
    needs: [security-scan]
    # NOT gated behind the changed-files check the two heavy shard matrices
    # below use: the CI topology contract (scripts/test_ci_workflow_topology.py)
    # requires this job's needs to be exactly {security-scan}, because the
    # test-go127 aggregate's fail-closed gate must be able to demand this
    # single cheap job's real success unconditionally. It is also five minutes
    # of "make test-replay-harness" with no shard fan-out, so skipping it on
    # ordinary PRs was never where the runner-queue contention came from --
    # that was the sixteen Go 1.27 race-test shard jobs in the matrices above.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      - name: Replay harness (deterministic regression)
        run: make test-replay-harness

  test-go126:
    needs: [security-scan, changed-files, test-unit-go126, test-subprocess-coverage, guard-conformance, test-replay-go126]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: test (1.26)
    timeout-minutes: 5
    steps:
      - name: Required check compatibility gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          # On a pull request, a skipped Go producer is evidence only when the
          # classifier succeeded and said the change is documentation-only.
          # Every other non-success result reds this required check.
          test "${{ needs.security-scan.result }}" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "${{ needs.changed-files.result }}" = "success"
          fi
          echo "test-unit-go126 result: ${{ needs.test-unit-go126.result }}"
          if ! test "${{ needs.test-unit-go126.result }}" = "success"; then
            if [ "$EVENT_NAME" != "pull_request" ] || [ "${{ needs.test-unit-go126.result }}" != "skipped" ]; then
              exit 1
            fi
            test "${{ needs.changed-files.outputs.docs_only }}" = "true"
          fi
          echo "test-subprocess-coverage result: ${{ needs.test-subprocess-coverage.result }}"
          if ! test "${{ needs.test-subprocess-coverage.result }}" = "success"; then
            if [ "$EVENT_NAME" != "pull_request" ] || [ "${{ needs.test-subprocess-coverage.result }}" != "skipped" ]; then
              exit 1
            fi
            test "${{ needs.changed-files.outputs.docs_only }}" = "true"
          fi
          echo "guard-conformance result: ${{ needs.guard-conformance.result }}"
          if ! test "${{ needs.guard-conformance.result }}" = "success"; then
            if [ "$EVENT_NAME" != "pull_request" ] || [ "${{ needs.guard-conformance.result }}" != "skipped" ]; then
              exit 1
            fi
            test "${{ needs.changed-files.outputs.docs_only }}" = "true"
          fi
          echo "test-replay-go126 result: ${{ needs.test-replay-go126.result }}"
          test "${{ needs.test-replay-go126.result }}" = "success"

  # Race lane rollup for main. It does not run on pull requests, where the race
  # producers are skipped by design, so a skipped "race (1.26)" on a pull request
  # means "not this lane's event", never "proven".
  race-go126:
    needs: [security-scan, test-oss-go126, test-enterprise-go126]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    name: race (1.26)
    timeout-minutes: 5
    steps:
      - name: Race lane gate
        run: |
          echo "security-scan result: ${{ needs.security-scan.result }}"
          echo "test-oss-go126 result: ${{ needs.test-oss-go126.result }}"
          echo "test-enterprise-go126 result: ${{ needs.test-enterprise-go126.result }}"
          test "${{ needs.security-scan.result }}" = "success"
          test "${{ needs.test-oss-go126.result }}" = "success"
          test "${{ needs.test-enterprise-go126.result }}" = "success"

  test-go127:
    needs: [security-scan, changed-files, test-oss-go127, test-enterprise-go127, test-replay-go127]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # "test (1.27)" is a required check name on every PR (see the branch
    # ruleset), so it must exist even when the Go 1.27 race producers skip.
    # On a pull request, require successful policy detection and a boolean
    # output. Only an explicit false justifies skipped race producers. On a
    # push, the policy detector and race producers intentionally skip.
    # Security scan and replay evidence must succeed on both events.
    name: test (1.27)
    timeout-minutes: 5
    steps:
      - name: Required check compatibility gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          # A bare `test ... || { ... }` compound does NOT reliably exit under
          # bash's real -e semantics: a failing command on the left of `||`
          # never triggers errexit, and neither does the right-hand block when
          # its own last command fails as part of a further `&&`
          # short-circuit. That combination let this gate print its own
          # per-producer diagnostics and still exit 0 -- reproduced with an
          # actual `bash -eo pipefail` run (GitHub Actions' real default
          # shell) for a failed, an unknown, and an unexpectedly-skipped
          # producer result. Every non-success path below exits explicitly
          # instead of relying on the compound's own exit status.
          test "${{ needs.security-scan.result }}" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "${{ needs.changed-files.result }}" = "success"
            if [ "${{ needs.changed-files.outputs.ci_policy }}" != "false" ]; then
              test "${{ needs.changed-files.outputs.ci_policy }}" = "true"
            fi
          fi

          echo "test-oss-go127 result: ${{ needs.test-oss-go127.result }}"
          if ! test "${{ needs.test-oss-go127.result }}" = "success"; then
            if [ "${{ needs.test-oss-go127.result }}" != "skipped" ]; then
              exit 1
            fi
            if [ "$EVENT_NAME" = "pull_request" ]; then
              test "${{ needs.changed-files.outputs.ci_policy }}" = "false"
            fi
          fi

          echo "test-enterprise-go127 result: ${{ needs.test-enterprise-go127.result }}"
          if ! test "${{ needs.test-enterprise-go127.result }}" = "success"; then
            if [ "${{ needs.test-enterprise-go127.result }}" != "skipped" ]; then
              exit 1
            fi
            if [ "$EVENT_NAME" = "pull_request" ]; then
              test "${{ needs.changed-files.outputs.ci_policy }}" = "false"
            fi
          fi

          echo "test-replay-go127 result: ${{ needs.test-replay-go127.result }}"
          test "${{ needs.test-replay-go127.result }}" = "success"

  test-macos:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Verify native target is darwin/arm64
        run: |
          set -euo pipefail
          echo "runner architecture: $RUNNER_ARCH"
          go_target="$(go env GOOS)/$(go env GOARCH)"
          echo "Go target: $go_target"
          test "$RUNNER_ARCH" = "ARM64"
          test "$go_target" = "darwin/arm64"

      - name: Run sandbox tests (macOS seatbelt)
        run: go test -race -count=1 ./internal/sandbox/...

      - name: Verify cross-platform build
        run: go build ./...

  test-macos-intel:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Verify native target is darwin/amd64
        run: |
          set -euo pipefail
          echo "runner architecture: $RUNNER_ARCH"
          go_target="$(go env GOOS)/$(go env GOARCH)"
          echo "Go target: $go_target"
          test "$RUNNER_ARCH" = "X64"
          test "$go_target" = "darwin/amd64"

      - name: Run sandbox tests (macOS seatbelt)
        run: go test -race -count=1 ./internal/sandbox/...

      - name: Verify cross-platform build
        run: go build ./...

  # Native Windows smoke lane. Pipelock had zero Windows CI, which let the
  # recorder signing-key perm gate (#695) and the key-free MCP capture path
  # (#696) regress on real Windows undetected. This is a TARGETED lane, not full
  # parity: the full suite asserts Unix file modes that Go can't report on
  # Windows (it derives FileMode from the read-only attribute, never the ACL),
  # so internal/config still has ~27 permission-model failures here. So we run
  # the OS-split predicate plus the load/capture paths that #695/#696 touch,
  # scoped with -run. config's perm behavior is proven transitively by the
  # secperm Windows test (all masks skip when secperm.Enforced is false).
  # internal/config's test package previously could not COMPILE on Windows
  # (syscall.Mkfifo), which `go build ./...` cannot catch because it never
  # builds _test.go files. The scoped run below compiles that package so the
  # break cannot return silently.
  test-windows:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Verify native target is windows/amd64
        shell: pwsh
        run: |
          Write-Output "runner architecture: $env:RUNNER_ARCH"
          $goTarget = "$(go env GOOS)/$(go env GOARCH)"
          Write-Output "Go target: $goTarget"
          if ($env:RUNNER_ARCH -ne "X64") { throw "expected X64 runner, got $env:RUNNER_ARCH" }
          if ($goTarget -ne "windows/amd64") { throw "expected windows/amd64 Go target, got $goTarget" }

      - name: Verify Windows build (OSS + enterprise)
        run: |
          go build ./...
          go build -tags enterprise ./...

      # -race is intentionally omitted: it needs a CGO C compiler on the runner,
      # a common source of unrelated red CI on Windows. The Linux matrix already
      # runs the race detector across all code; this lane proves Windows
      # functional behavior, not data races.
      - name: secperm OS split (mode checks skipped on Windows)
        run: go test -count=1 ./internal/secperm/...

      - name: Discover classic and packaged desktop configurations
        run: go test -count=1 -run "TestDiscoverClaudeWindowsLayouts" ./internal/discover/...

      - name: Signing key / salt / header-file load at any reported mode (#695)
        run: go test -count=1 -run "TestWindows" ./internal/signing/... ./internal/contract/privacy/... ./internal/cli/runtime/... ./internal/recorder/...

      - name: Key-free MCP capture writer smoke (#696)
        run: go test -count=1 -run "TestBuildCaptureWriter|TestParseCaptureEscrowKey" ./internal/cli/runtime/...

      - name: Baseline no-follow reads work on Windows
        run: go test -count=1 -run "TestWindows" ./internal/proxy/baseline/...

      # Compiling this package is the point: it guards the Mkfifo-class break.
      - name: internal/config test package builds on Windows
        run: go test -count=1 -run "TestWindows" ./internal/config/...

  test-windows-arm64:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Verify native target is windows/arm64
        shell: pwsh
        run: |
          Write-Output "runner architecture: $env:RUNNER_ARCH"
          $goTarget = "$(go env GOOS)/$(go env GOARCH)"
          Write-Output "Go target: $goTarget"
          if ($env:RUNNER_ARCH -ne "ARM64") { throw "expected ARM64 runner, got $env:RUNNER_ARCH" }
          if ($goTarget -ne "windows/arm64") { throw "expected windows/arm64 Go target, got $goTarget" }

      - name: Verify Windows build (OSS + enterprise)
        run: |
          go build ./...
          go build -tags enterprise ./...

      # Keep this paired with test-windows. These targeted packages avoid the
      # Unix permission assertions that make a full Windows suite misleading.
      - name: secperm OS split (mode checks skipped on Windows)
        run: go test -count=1 ./internal/secperm/...

      - name: Discover classic and packaged desktop configurations
        run: go test -count=1 -run "TestDiscoverClaudeWindowsLayouts" ./internal/discover/...

      - name: Signing key / salt / header-file load at any reported mode (#695)
        run: go test -count=1 -run "TestWindows" ./internal/signing/... ./internal/contract/privacy/... ./internal/cli/runtime/... ./internal/recorder/...

      - name: Key-free MCP capture writer smoke (#696)
        run: go test -count=1 -run "TestBuildCaptureWriter|TestParseCaptureEscrowKey" ./internal/cli/runtime/...

      - name: Baseline no-follow reads work on Windows
        run: go test -count=1 -run "TestWindows" ./internal/proxy/baseline/...

      - name: internal/config test package builds on Windows
        run: go test -count=1 -run "TestWindows" ./internal/config/...

  # Native linux/arm64 lane. GoReleaser publishes a linux/arm64 binary
  # (.goreleaser.yaml) and no job has ever executed a test on that architecture,
  # so three of six published Go targets ran zero tests. arm64 is not a
  # theoretical target here: it is Graviton, Ampere, Apple Silicon Linux VMs, and
  # the single-board machines an evaluator is most likely to reach for.
  #
  # The architecture is load-bearing for containment, not incidental. seccomp is
  # built only for linux && amd64 (internal/sandbox/seccomp_linux.go), so an
  # arm64 binary composes against seccomp_other.go and reports that layer
  # unavailable. In the CLI's default non-strict mode a missing layer reduces
  # containment and only logs it, so the arm64 degradation path is exactly the
  # behavior that most needs a test and had none. The seccomp tests themselves
  # are tagged linux && amd64 and stay out of this lane by construction; what
  # runs here is the shared sandbox code deciding what to do when a layer is
  # absent.
  #
  # TARGETED, like the macOS and Windows lanes above, not full parity. The amd64
  # matrix remains the exhaustive lane.
  test-linux-arm64:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Verify native target is linux/arm64
        run: |
          set -euo pipefail
          echo "runner architecture: $RUNNER_ARCH"
          go_target="$(go env GOOS)/$(go env GOARCH)"
          echo "Go target: $go_target"
          test "$RUNNER_ARCH" = "ARM64"
          test "$go_target" = "linux/arm64"

      # A published target that has never been compiled natively can break in
      # ways cross-compilation catches and ways it does not, and `go build` never
      # builds _test.go files, so a test package that cannot compile on arm64
      # would stay invisible to it.
      - name: Verify arm64 build (OSS + enterprise)
        run: |
          go build ./...
          go build -tags enterprise ./...

      - name: Sandbox behavior without Pipelock's seccomp filter
        run: go test -race -count=1 ./internal/sandbox/...

      # Preflight and diagnose are what tell an operator which layers they are
      # actually getting. On arm64 they must report seccomp as unavailable
      # rather than claiming it.
      # `go test -run NAME` exits 0 when the filter matches NOTHING, including
      # when a build tag excludes the file entirely. Both guards below are tagged
      # `linux && !amd64`, so a tag drift, a rename, or a package move would leave
      # this lane green while proving nothing: the exact failure this job exists to
      # catch, relocated into the check. Assert the named test actually ran.
      - name: Preflight reports the real arm64 layer set
        run: |
          set -euo pipefail
          go test -race -count=1 -v -run TestDetectAndPreflightReportSeccompUnavailableWithoutFilter \
            ./internal/sandbox/... | tee /tmp/arm64-preflight.log
          grep -q '^--- PASS: TestDetectAndPreflightReportSeccompUnavailableWithoutFilter' /tmp/arm64-preflight.log

      - name: Diagnose reports the real arm64 layer set
        run: |
          set -euo pipefail
          go test -race -count=1 -v -run TestDiagnoseReportsSeccompUnavailableWithoutFilter \
            ./internal/cli/diag/... | tee /tmp/arm64-diagnose.log
          grep -q '^--- PASS: TestDiagnoseReportsSeccompUnavailableWithoutFilter' /tmp/arm64-diagnose.log

  # Exercise the browser target's concrete fail-closed filesystem fallbacks,
  # then compile the same contracts for WASI and AIX so build-tag gaps cannot
  # silently remove their implementations.
  test-unsupported-filesystems:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Run browser target fallback contracts
        run: GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" -count=1 -run "TestOpenRegularNonblockingFailsClosedOnUnsupportedPlatform|TestEvidenceFileOperationsFailClosedOnUnsupportedPlatform|TestLoadSaltFileFailsClosedOnUnsupportedPlatform|TestMCPAckKeyFileSourceRefusedOnBrowserTarget" ./internal/securefile/... ./internal/recorder/... ./internal/contract/privacy/...

      - name: Compile WASI fallback contracts
        run: |
          GOOS=wasip1 GOARCH=wasm go test -c -o /tmp/securefile-wasi.test ./internal/securefile
          GOOS=wasip1 GOARCH=wasm go test -c -o /tmp/recorder-wasi.test ./internal/recorder
          GOOS=wasip1 GOARCH=wasm go test -c -o /tmp/license-wasi.test ./internal/license
          GOOS=wasip1 GOARCH=wasm go test -c -o /tmp/privacy-wasi.test ./internal/contract/privacy

      - name: Compile AIX fallback contracts
        run: |
          GOOS=aix GOARCH=ppc64 go test -c -o /tmp/recorder-aix.test ./internal/recorder
          GOOS=aix GOARCH=ppc64 go test -c -o /tmp/license-aix.test ./internal/license

  # The reviewer's own regression suite now runs on pull requests.
  #
  # The repositories that kept their own copy of the reviewer ran these as a
  # step inside the review itself. That never gated anything: a review is
  # triggered by a comment, so it only ever executes the copy already on the
  # default branch, and by then the change is merged. Consolidating onto one
  # shared workflow then dropped even that step. So the suite has been proving
  # nothing in either arrangement, while every guard in it reported green.
  #
  # This job is what makes them load-bearing, because it runs on the pull
  # request that changes them. It covers the reviewer, the review workflow's
  # permissions and authorization gate, and the adoption stub that other
  # repositories copy.
  pr-review-tests:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          pip install --require-hashes -r .github/actions/pr-review/requirements.txt
          pip install --require-hashes -r .github/requirements-pr-review-test.txt

      - name: Run reviewer tests
        run: python -m unittest scripts.pr_review_test

  lint:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: golangci-lint (OSS)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          skip-cache: true


  # Same linter, enterprise build graph. A separate job so the two passes run
  # side by side instead of back to back.
  lint-enterprise:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: golangci-lint (enterprise)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          skip-cache: true
          args: --build-tags enterprise

  # Repository policy checks that used to run after golangci-lint in the lint
  # job. They need no lint result, so running them beside lint keeps both
  # jobs well inside the shard budget instead of one eleven-minute job.
  lint-policy:
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Python pin policy
        run: bash scripts/check-python-pins.sh

      # The release-tooling tests read the release workflow as parsed YAML rather
      # than as text, so PyYAML is a real dependency of this job. It is installed
      # hash-pinned rather than taken from whatever the runner image happens to
      # ship, because an undeclared dependency that works today breaks silently
      # when the image changes.
      - name: Install pinned release-tooling test dependencies
        run: pip install --require-hashes -r .github/requirements-pr-review-test.txt

      # Release-tooling tests had no PR-time runner, so breaks stayed invisible
      # until tag time. The pattern covers both test_*.py and *_test.py modules.
      - name: Release tooling unit tests
        run: python3 -m unittest discover -s scripts -p '*test*.py'

      - name: Test stability policy
        run: bash scripts/check-test-stability.sh

      - name: Config consumption policy
        run: bash scripts/check-config-consumption.sh

      - name: Codecov upload count matches the shard matrix
        run: bash scripts/check-codecov-upload-count.sh

      - name: Release workflow proves every Go minor main proves
        run: bash scripts/check-go-matrix.sh

      - name: Clock-dependent literal policy
        run: bash scripts/check-clock-literals.sh

      - name: Subprocess test deadline scaling policy
        run: bash scripts/check-test-deadline-scaling.sh

      - name: Install documentation search dependency
        run: bash scripts/ci-apt-install.sh ripgrep

      - name: Documentation accuracy and local links
        run: make docs-check

      - name: Source file headers
        run: make source-header-check

      - name: Shard load budget (OSS)
        run: python3 scripts/ci_test_packages.py --check-budget

      - name: Shard load budget (enterprise)
        run: python3 scripts/ci_test_packages.py --tags enterprise --check-budget

  # Builds and boots every shipped example, then rebuilds the binary twice to
  # prove the OSS build is reproducible. All of it compiles; none of it needs
  # the lint-policy checks, so it runs beside them.
  config-examples:
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Config example startability policy
        run: bash scripts/check-config-examples.sh

      # Released binaries are built with the enterprise tag, so the shipped
      # examples must also check and boot against that build shape.
      - name: Config example startability policy (enterprise build)
        run: |
          go build -tags enterprise -o "$RUNNER_TEMP/pipelock-enterprise" ./cmd/pipelock
          bash scripts/check-config-examples.sh "$RUNNER_TEMP/pipelock-enterprise"

      - name: Reproducible OSS build
        run: make reproducible-build-check

  # Test files are compiled by `go test`, never by `go build`, so a test file
  # that references a symbol guarded to one architecture makes an entire test
  # package uncompilable there while every build job stays green. That is not
  # hypothetical: internal/sandbox's test package could not compile on
  # linux/arm64 at all, because coverage_deep_test.go was tagged plain linux
  # while the seccomp filter builder and BPF helpers it calls exist only under
  # linux && amd64. A published target therefore had zero sandbox test coverage
  # and nothing said so. The same shape hit internal/config on Windows via
  # syscall.Mkfifo.
  #
  # `go vet` compiles test files, so cross-targeting it catches the class on this
  # amd64 runner without needing hardware for every target. Keep the expensive
  # cross-target pass separate from lint so neither job consumes the other's
  # timeout budget.
  test-cross-target:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    name: test-cross-target (${{ matrix.target }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Published targets other than the runner's own linux/amd64.
        target: ['linux/arm64', 'darwin/amd64', 'darwin/arm64', 'windows/amd64', 'windows/arm64']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Test code compiles for the published target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          GOOS="${TARGET%%/*}" GOARCH="${TARGET##*/}" go vet ./...
          GOOS="${TARGET%%/*}" GOARCH="${TARGET##*/}" go vet -tags enterprise ./...

  helm:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.2

      - name: Verify Helm chart
        run: bash scripts/check-helm-chart.sh

  govulncheck:
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Pin the exact patched release. govulncheck analyzes the active
          # toolchain's stdlib (go env GOVERSION), so the setup-go version is the
          # lever, not the go.mod directive. The pin is the newest published
          # 1.26 patch, because each one carries stdlib advisory fixes this tree
          # reaches through the proxy and MCP transport call paths. The 1.26.6
          # pin that preceded this one was chosen for six such fixes over
          # go1.26.5 across crypto/tls, html/template, net/http and net/url
          # (GO-2026-5026, GO-2026-5972, GO-2026-6089, GO-2026-6090,
          # GO-2026-6091, GO-2026-6218). A float to '1.26' can lag on the
          # actions/go-versions manifest, so the scan stays red until the
          # manifest publishes the patched toolchain. An EXACT version makes
          # setup-go fall back to a direct download from the official Go
          # distribution, bypassing the manifest.
          #
          # This job scans the same 1.26 toolchain release.yaml builds the
          # shipped binaries with, so a green scan here covers the released
          # artifact only while the two pins match. Move them together; the
          # release pins were found trailing this one on 2026-09-05.
          #
          # THIS PIN GOES STALE BY DESIGN. Every Go patch release that fixes a
          # reachable stdlib advisory turns this job red repo-wide until the pin
          # moves, which is what happened on 2026-08-13. Bump it here and in the
          # assertion below, together; they are asserted equal on purpose so a
          # half-done bump fails loudly instead of scanning the wrong toolchain.
          # Revert to '1.26' + check-latest for steady-state self-healing once
          # the manifest reliably carries the newest patch.
          go-version: '1.26.9'
          check-latest: true

      - name: Verify Go version
        # Fail loud if setup-go silently resolved a different stdlib (e.g. a
        # stale cached 1.26.3) instead of letting a wrong toolchain false-green.
        run: |
          got="$(go env GOVERSION)"
          echo "GOVERSION=$got"
          test "$got" = "go1.26.9"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Reject unsafe OpenPGP packages
        run: |
          set -euo pipefail
          dependencies=$(mktemp)
          trap 'rm -f "$dependencies"' EXIT
          {
            go list -deps ./...
            go list -tags enterprise -deps ./...
          } > "$dependencies"
          if grep -Eq '^golang\.org/x/crypto/openpgp(/|$)' "$dependencies"; then
            echo "unsafe OpenPGP package detected in dependency graph" >&2
            exit 1
          fi

      - name: Run govulncheck
        # Scan both build graphs. Enterprise-only packages can make a vulnerable
        # dependency reachable even when the default build remains clean.
        run: |
          default_status=0
          enterprise_status=0
          govulncheck ./... || default_status=$?
          govulncheck -tags enterprise ./... || enterprise_status=$?
          if (( default_status != 0 || enterprise_status != 0 )); then
            echo "govulncheck failed: default=$default_status enterprise=$enterprise_status" >&2
            exit 1
          fi

  # Compile in parallel with tests and lint so a successful critical path does
  # not pay the build cost after the slowest test shard has already finished.
  build-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security-scan, changed-files]
    # Skipped only on a documentation-only pull request; see changed-files.
    if: ${{ !cancelled() && needs.security-scan.result == 'success' && needs.changed-files.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Build binary
        run: |
          VERSION=$(./scripts/git-version.sh)
          go build -trimpath -ldflags "-s -w \
            -X github.com/luckyPipewrench/pipelock/internal/cliutil.Version=$VERSION \
            -X github.com/luckyPipewrench/pipelock/internal/proxy.Version=$VERSION" \
            -o pipelock ./cmd/pipelock

      - name: Verify binary runs
        run: ./pipelock --version

      - name: Build binary (enterprise)
        run: |
          VERSION=$(./scripts/git-version.sh)
          go build -tags enterprise -trimpath -ldflags "-s -w \
            -X github.com/luckyPipewrench/pipelock/internal/cliutil.Version=$VERSION \
            -X github.com/luckyPipewrench/pipelock/internal/proxy.Version=$VERSION" \
            -o pipelock-enterprise ./cmd/pipelock

      - name: Verify enterprise binary runs
        run: ./pipelock-enterprise --version

      - name: Cross-build Windows binaries (enterprise)
        run: |
          GOOS=windows GOARCH=amd64 go build -tags enterprise -trimpath -o /tmp/pipelock-windows-amd64.exe ./cmd/pipelock
          GOOS=windows GOARCH=arm64 go build -tags enterprise -trimpath -o /tmp/pipelock-windows-arm64.exe ./cmd/pipelock

  # Helm remains a separate diagnostic job, but the required `build` context
  # intentionally carries its result through `needs`. Keep that dependency
  # until a separately approved ruleset change makes `helm` required itself.
  # The parallel binary and cross-target producers also flow through this gate,
  # so a compilation failure cannot present as a successful required build check.
  build:
    needs: [security-scan, changed-files, test-go126, test-go127, lint, lint-enterprise, lint-policy, config-examples, test-cross-target, helm, build-binaries, pr-review-tests, pr-review-source]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report required build evidence
        env:
          SECURITY_SCAN_RESULT: ${{ needs.security-scan.result }}
          TEST_GO126_RESULT: ${{ needs.test-go126.result }}
          TEST_GO127_RESULT: ${{ needs.test-go127.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          LINT_POLICY_RESULT: ${{ needs.lint-policy.result }}
          LINT_ENTERPRISE_RESULT: ${{ needs.lint-enterprise.result }}
          CONFIG_EXAMPLES_RESULT: ${{ needs.config-examples.result }}
          CROSS_TARGET_RESULT: ${{ needs.test-cross-target.result }}
          HELM_RESULT: ${{ needs.helm.result }}
          BUILD_BINARIES_RESULT: ${{ needs.build-binaries.result }}
          REVIEW_TESTS_RESULT: ${{ needs.pr-review-tests.result }}
          REVIEW_SOURCE_RESULT: ${{ needs.pr-review-source.result }}
          REPOSITORY: ${{ github.repository }}
          CHANGED_FILES_RESULT: ${{ needs.changed-files.result }}
          DOCS_ONLY: ${{ needs.changed-files.outputs.docs_only }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # test (1.27) accepts skipped upper-lane producers on a pull request
          # because changed-files decided no CI-policy file changed. A failed or
          # cancelled classifier skips them too, so a pull request needs a
          # successful classifier here before that skip counts as intentional.
          if [ "$EVENT_NAME" = pull_request ] && [ "$CHANGED_FILES_RESULT" != success ]; then
            echo "changed-files did not succeed, so skipped upper-lane tests are not evidence" >&2
            exit 1
          fi
          # Only the canonical repository can prove its own reusable source
          # identity. Fork CI intentionally skips that credential-free probe.
          if [ "$REVIEW_SOURCE_RESULT" != success ]; then
            if [ "$REPOSITORY" = luckyPipewrench/pipelock ] || [ "$REVIEW_SOURCE_RESULT" != skipped ]; then
              echo "review source identity was not verified" >&2
              exit 1
            fi
          fi
          # A documentation-only pull request skips these producers on purpose.
          # The skip is evidence only with a successful classifier that said so.
          docs_skip_ok=false
          if [ "$EVENT_NAME" = pull_request ] && [ "$CHANGED_FILES_RESULT" = success ] && [ "$DOCS_ONLY" = true ]; then
            docs_skip_ok=true
          fi
          for result in \
            "$SECURITY_SCAN_RESULT" \
            "$TEST_GO126_RESULT" \
            "$TEST_GO127_RESULT" \
            "$LINT_POLICY_RESULT" \
            "$CONFIG_EXAMPLES_RESULT"; do
            if [ "$result" != success ]; then
              echo "required build evidence is incomplete or failed" >&2
              exit 1
            fi
          done
          for result in \
            "$LINT_RESULT" \
            "$LINT_ENTERPRISE_RESULT" \
            "$CROSS_TARGET_RESULT" \
            "$HELM_RESULT" \
            "$REVIEW_TESTS_RESULT" \
            "$BUILD_BINARIES_RESULT"; do
            if [ "$result" = skipped ] && [ "$docs_skip_ok" = true ]; then
              continue
            fi
            if [ "$result" != success ]; then
              echo "required build evidence is incomplete or failed" >&2
              exit 1
            fi
          done

  # Operator-facing rollup only. Branch protection continues to evaluate the
  # required producer checks independently.
  pipelock-ci-summary:
    needs: [security-scan, changed-files, test-go126, test-go127, test-macos, lint, build, govulncheck]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Pipelock CI Summary
    timeout-minutes: 5
    steps:
      - name: Report required check evidence
        env:
          SECURITY_SCAN_RESULT: ${{ needs.security-scan.result }}
          TEST_GO126_RESULT: ${{ needs.test-go126.result }}
          TEST_GO127_RESULT: ${{ needs.test-go127.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          GOVULNCHECK_RESULT: ${{ needs.govulncheck.result }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES_RESULT: ${{ needs.changed-files.result }}
          DOCS_ONLY: ${{ needs.changed-files.outputs.docs_only }}
        run: |
          set -euo pipefail
          failed=0
          summary="$GITHUB_STEP_SUMMARY"
          printf '%s\n\n' '## Pipelock CI Summary' > "$summary"
          printf '%s\n\n' '| Required check | Evidence |' >> "$summary"
          printf '%s\n' '| --- | --- |' >> "$summary"

          docs_skip_ok=false
          if [ "$EVENT_NAME" = pull_request ] && [ "$CHANGED_FILES_RESULT" = success ] && [ "$DOCS_ONLY" = true ]; then
            docs_skip_ok=true
          fi

          # A third argument marks a producer a documentation-only pull request
          # skips on purpose.
          record_result() {
            local name="$1"
            local result="$2"
            local docs_skippable="${3:-}"
            if [ "$result" = skipped ] && [ -n "$docs_skippable" ] && [ "$docs_skip_ok" = true ]; then
              printf '| %s | skipped (documentation only) |\n' "$name" >> "$summary"
              return
            fi
            printf '| %s | %s |\n' "$name" "$result" >> "$summary"
            case "$result" in
              success) ;;
              *) failed=1 ;;
            esac
          }

          record_result 'security-scan' "$SECURITY_SCAN_RESULT"
          record_result 'test (1.26)' "$TEST_GO126_RESULT"
          record_result 'test (1.27)' "$TEST_GO127_RESULT"
          record_result 'test-macos' "$MACOS_RESULT" docs
          record_result 'lint' "$LINT_RESULT" docs
          record_result 'build' "$BUILD_RESULT"
          record_result 'govulncheck' "$GOVULNCHECK_RESULT" docs

          printf '\nCodeQL is separately required and runs in its own workflow; it is intentionally outside this summary.\n' >> "$summary"

          if [ "$failed" -ne 0 ]; then
            printf '\nOne or more required checks failed, were cancelled, skipped unexpectedly, or had unknown evidence.\n' >> "$summary"
            exit 1
          fi
