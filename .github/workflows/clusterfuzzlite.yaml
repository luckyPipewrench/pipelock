name: ClusterFuzzLite
on:
  pull_request:
    branches: [ main ]
    paths:
      # ClusterFuzzLite builds Go fuzzers from source. Keep this advisory,
      # expensive job tied to code, module, corpus, and fuzzer-build inputs.
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '**/testdata/fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/clusterfuzzlite.yaml'
permissions:
  contents: read
jobs:
  PR:
    runs-on: ubuntu-latest
    # Healthy runs take 15-16 minutes (pull, about three minutes of fuzzer
    # build, then a 600s fuzz budget that runs 12-13 minutes with startup and
    # merging). A 20-minute limit left four minutes of room, and slower fuzz runs
    # (16 minutes) were killed and reported as cancelled. The fuzz budget is
    # unchanged; only the job limit has room now.
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: go
          fuzz-seconds: 600
          mode: 'code-change'
