name: ClusterFuzzLite
on:
  pull_request:
    branches: [ main ]
    paths:
      # ClusterFuzzLite builds Go fuzzers from source. Keep this advisory,
      # expensive job tied to code, module, corpus, and fuzzer-build inputs.
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '**/testdata/fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/clusterfuzzlite.yaml'
permissions:
  contents: read
jobs:
  PR:
    runs-on: ubuntu-latest
    # A 600s fuzz budget made healthy runs take 15-16 minutes and slow ones hit
    # the 30-minute limit, which GitHub shows as a red cancelled check on the
    # pull request. Code-change mode fuzzes only the targets the diff reaches,
    # and most of its findings land in the first minutes, so the budget is now
    # 300s: about three minutes of build plus five of fuzzing, under a limit
    # with room for a slow pull.
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: go
          fuzz-seconds: 300
          mode: 'code-change'
