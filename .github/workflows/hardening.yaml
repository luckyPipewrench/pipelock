name: Hardening

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: hardening-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install ripgrep
        run: bash scripts/ci-apt-install.sh ripgrep

      - name: Workflow and release audit
        run: make release-audit

  # Runtime race coverage remains PR-blocking in ci.yaml: its required OSS
  # and enterprise matrices shard every buildable package across
  # proxy/scanner/MCP/rest. Do not add a second serial runtime lane here.

  runtime-policy:
    # Blocking on PRs, not just at release-tag time: a runtime package
    # that re-introduces direct mutation of policy-relevant config would
    # otherwise land on main and only get caught when someone tags a
    # release. The release workflow still runs this audit as a defense-
    # in-depth gate; this job catches regressions earlier.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install ripgrep
        run: bash scripts/ci-apt-install.sh ripgrep

      - name: Runtime policy audit
        run: make runtime-policy-audit
