name: Reusable AI PR Review

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to review.
        required: true
        type: string
      review_mode:
        description: default or deep.
        required: true
        type: string
      reviewer_sha:
        description: Optional compatibility pin; must match the loaded workflow commit.
        required: false
        default: ''
        type: string
    secrets:
      review_token:
        required: true
      openai_api_key:
        required: false

permissions:
  contents: read
  issues: write
  # Both are required. Posting a comment on a PULL REQUEST needs
  # pull-requests: write even though the call goes to the issue-comments
  # endpoint; issues: write alone covers issues only, and the comment-create
  # call returns 403. Verified live: this was reduced to read and every
  # /review in the repository failed until it was restored. Do not narrow it
  # again without running a real /review against a pull request.
  pull-requests: write

jobs:
  source:
    # Local reusable calls load the helper from this workflow's own revision.
    # Do not pass secrets: source identity must be validated before admission.
    permissions: {}
    uses: ./.github/workflows/pr-review-source.yaml
    with:
      reviewer_sha: ${{ inputs.reviewer_sha }}

  admit:
    needs: source
    # Serialize only the fast admission step. It persists a running status
    # comment before provider work begins, so a later command can reply with
    # that comment's link rather than start another review.
    concurrency:
      group: pr-review-${{ github.repository }}-${{ inputs.pr_number }}
      cancel-in-progress: false
      # Without this GitHub keeps only ONE pending job per group and a newly
      # queued run cancels the pending one, so a second /review can cancel a
      # queued completeness job before it publishes the coverage status or
      # finalizes the review comment. That is the same silent-verdict failure
      # the status exists to remove. `queue: max` is compatible here only
      # because cancel-in-progress is false; the two cannot be combined.
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
      base_sha: ${{ steps.claim.outputs.base_sha }}
      head_sha: ${{ steps.claim.outputs.head_sha }}
      status_comment_id: ${{ steps.claim.outputs.status_comment_id }}
      correlation: ${{ steps.claim.outputs.correlation }}
    steps:
      # A called workflow's normal checkout is the caller repository. Fetch
      # Pipelock at the validated loaded workflow SHA so the workflow, action,
      # and runner all come from the same immutable revision.
      - name: Check out immutable Pipelock review source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: luckyPipewrench/pipelock
          ref: ${{ needs.source.outputs.reviewer_sha }}
          path: trusted-pr-review
          persist-credentials: false

      - name: Claim review status
        id: claim
        uses: ./trusted-pr-review/.github/actions/pr-review
        with:
          github-token: ${{ secrets.review_token }}
          repo: ${{ github.repository }}
          pr-number: ${{ inputs.pr_number }}
          review-mode: ${{ inputs.review_mode }}
          reviewer-sha: ${{ needs.source.outputs.reviewer_sha }}
          model-fast: ${{ vars.PR_REVIEW_MODEL_FAST }}
          model-deep: ${{ vars.PR_REVIEW_MODEL_DEEP }}
          operation: claim


  review:
    needs: [source, admit]
    if: needs.admit.outputs.claimed == 'true'
    runs-on: ubuntu-latest
    # Must exceed the reviewer's REVIEW_WALL_CLOCK_SECONDS with room for the
    # checkouts and finalization; the reviewer's test suite pins the margin.
    timeout-minutes: 60
    outputs:
      state: ${{ steps.openai.outputs.state || steps.nocreds.outputs.state }}
      complete: ${{ steps.openai.outputs.complete || steps.nocreds.outputs.complete }}
    env:
      HAS_OPENAI: ${{ secrets.openai_api_key != '' && 'true' || 'false' }}
    steps:
      - name: Check out immutable Pipelock review source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: luckyPipewrench/pipelock
          ref: ${{ needs.source.outputs.reviewer_sha }}
          path: trusted-pr-review
          persist-credentials: false

      - name: Check out immutable reviewed repository head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.head_sha }}
          path: reviewed-repository
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve immutable merge base
        id: merge-base
        env:
          GH_TOKEN: ${{ secrets.review_token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ needs.admit.outputs.base_sha }}
          HEAD_SHA: ${{ needs.admit.outputs.head_sha }}
        run: |
          set -euo pipefail
          merge_base="$(gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          if [[ ! "${merge_base}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "compare response did not contain an immutable merge base" >&2
            exit 1
          fi
          echo "sha=${merge_base}" >> "${GITHUB_OUTPUT}"

      # A second depth-one checkout gives Git the authoritative merge-base
      # snapshot without downloading every branch, tag, and historical object.
      - name: Check out immutable reviewed repository merge base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.merge-base.outputs.sha }}
          path: reviewed-merge-base
          fetch-depth: 1
          persist-credentials: false

      - name: Import immutable merge base into reviewed checkout
        env:
          MERGE_BASE_SHA: ${{ steps.merge-base.outputs.sha }}
        run: |
          set -euo pipefail
          timeout 90s git -C reviewed-repository fetch --no-tags --depth=1 "${GITHUB_WORKSPACE}/reviewed-merge-base" "${MERGE_BASE_SHA}"
          git -C reviewed-repository cat-file -e "${MERGE_BASE_SHA}^{commit}"

      # The runner receives one provider credential, never both. Named secret
      # mappings are required because personal-account repositories cannot use
      # secrets: inherit with a reusable workflow.
      - name: Run review through OpenAI
        id: openai
        if: env.HAS_OPENAI == 'true'
        uses: ./trusted-pr-review/.github/actions/pr-review
        with:
          github-token: ${{ secrets.review_token }}
          repo: ${{ github.repository }}
          pr-number: ${{ inputs.pr_number }}
          review-mode: ${{ inputs.review_mode }}
          reviewer-sha: ${{ needs.source.outputs.reviewer_sha }}
          operation: review
          base-sha: ${{ needs.admit.outputs.base_sha }}
          head-sha: ${{ needs.admit.outputs.head_sha }}
          status-comment-id: ${{ needs.admit.outputs.status_comment_id }}
          review-identity: ${{ needs.admit.outputs.correlation }}
          openai-api-key: ${{ secrets.openai_api_key }}
          model-fast: ${{ vars.PR_REVIEW_MODEL_FAST }}
          model-deep: ${{ vars.PR_REVIEW_MODEL_DEEP }}
          reviewed-repository-path: ${{ github.workspace }}/reviewed-repository
          reviewed-merge-base-sha: ${{ steps.merge-base.outputs.sha }}

      - name: Report missing provider credential
        id: nocreds
        if: env.HAS_OPENAI != 'true'
        uses: ./trusted-pr-review/.github/actions/pr-review
        with:
          github-token: ${{ secrets.review_token }}
          repo: ${{ github.repository }}
          pr-number: ${{ inputs.pr_number }}
          review-mode: ${{ inputs.review_mode }}
          reviewer-sha: ${{ needs.source.outputs.reviewer_sha }}
          operation: review
          base-sha: ${{ needs.admit.outputs.base_sha }}
          head-sha: ${{ needs.admit.outputs.head_sha }}
          status-comment-id: ${{ needs.admit.outputs.status_comment_id }}
          review-identity: ${{ needs.admit.outputs.correlation }}
          model-fast: ${{ vars.PR_REVIEW_MODEL_FAST }}
          model-deep: ${{ vars.PR_REVIEW_MODEL_DEEP }}


  # Separate from the review job on purpose. Inside it, this was skipped in the
  # one case it most needs to cover: admission claims the status comment and the
  # review job never starts, leaving the comment reading running until its stale
  # timeout blocks later reviews.
  finalize:
    needs: [source, admit, review]
    if: always() && needs.source.result == 'success' && needs.admit.outputs.claimed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The job timeout, a cancellation, or a failed checkout all end this job
      # before any step above finalizes the status comment. Left running, the
      # admission check treats it as an active review and refuses later reviews
      # on the same head. This deliberately uses the preinstalled CLI instead of
      # the checked-out action: a failed checkout is one of the cases it has to
      # survive, so it cannot depend on that checkout existing. It edits only
      # the comment this run claimed, and only while that comment still reads
      # running, so a completed review is never overwritten.
      - name: Finalize an abandoned review
        env:
          GH_TOKEN: ${{ secrets.review_token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ needs.admit.outputs.status_comment_id }}
          BASE_SHA: ${{ needs.admit.outputs.base_sha }}
          HEAD_SHA: ${{ needs.admit.outputs.head_sha }}
          IDENTITY: ${{ needs.admit.outputs.correlation }}
          REVIEW_MODE: ${{ inputs.review_mode }}
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_STATE: ${{ needs.review.outputs.state }}
        run: |
          set -euo pipefail
          if [ -z "${COMMENT_ID}" ] || [ -z "${IDENTITY}" ]; then
            echo "pr-review phase=finalize status=no-claim"
            exit 0
          fi
          # Only known values reach the workflow commands below, so a stray
          # newline cannot start a command of its own.
          case "${REVIEW_RESULT:-}" in success|failure|cancelled|skipped) ;; *) REVIEW_RESULT=unreported ;; esac
          case "${REVIEW_STATE:-}" in clean|findings|partial|inconclusive|failed|superseded) ;; *) REVIEW_STATE=unreported ;; esac
          read_ok=false
          for attempt in 1 2 3; do
            if body="$(gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" --jq '.body')"; then
              read_ok=true
              break
            fi
            if [ "${attempt}" -lt 3 ]; then sleep 5; fi
          done
          # A review job that succeeded has already published its verdict, so an
          # unreadable comment is only a warning there. Any other review result
          # may have left the comment reading running, which blocks reruns, so
          # that stays a failure. The edit below stays fatal either way: it runs
          # only while the comment still reads running, when nothing was published.
          if [ "${read_ok}" != true ]; then
            if [ "${REVIEW_RESULT}" = success ]; then
              echo "::warning title=pr-review finalize::could not read the status comment; the review job succeeded, so its verdict stands and the comment was left unchanged (state ${REVIEW_STATE})"
              exit 0
            fi
            echo "::error title=pr-review finalize::could not read the status comment, so it may still read running (review job ${REVIEW_RESULT}). Re-run only the finalize job to retry finalization without starting provider work. New review commands stay blocked until finalization closes the claim or the claim is 105 minutes old (the stale-claim timeout)."
            exit 1
          fi
          # Both conditions matter. The state check leaves a completed review
          # alone, and the identity check makes this edit only ever land on the
          # comment this run claimed, never on a newer review's.
          case "${body}" in
            *"<!-- pr-review-status:v1 state=running identity=${IDENTITY} "*) ;;
            *) echo "pr-review phase=finalize status=not-ours-or-already-final"; exit 0 ;;
          esac
          profile=""
          while IFS= read -r line; do
            case "${line}" in
              '**Review profile:** '*) profile="${line}"; break ;;
            esac
          done <<< "${body}"
          case "${REVIEW_MODE}" in
            default) profile_pattern='^\*\*Review profile:\*\* `default` with `[A-Za-z0-9._:/-]+` \(`[a-z]+` reasoning\); candidate judge `[A-Za-z0-9._:/-]+` \(`[a-z]+` reasoning\)\.$' ;;
            deep) profile_pattern='^\*\*Review profile:\*\* `deep` with `[A-Za-z0-9._:/-]+` \(`[a-z]+` reasoning\)\.$' ;;
            *) profile_pattern='a^' ;;
          esac
          if [[ ! "${profile}" =~ ${profile_pattern} ]]; then
            profile="**Review profile:** \`${REVIEW_MODE}\`; the review job did not publish its effective model."
          fi
          # A per-run file, so two finalize runs on one host cannot post each other's body.
          body_file="$(mktemp "${RUNNER_TEMP:-/tmp}/pr-review-finalize.XXXXXX")"
          printf '## AI PR Review\n\n**Verdict:** `failed`\n%s\n**Findings:** unavailable because the review job did not publish a final result.\n\n<details>\n<summary>Review details: binding and identity</summary>\n\n**Binding:** base `%s` head `%s`\n**Review identity:** `%s`\n\n</details>\n\n<!-- pr-review-status:v1 state=failed identity=%s mode=%s findings= reviewed_head=%s scope=full coverage_base=%s -->\n' \
            "${profile}" "${BASE_SHA}" "${HEAD_SHA}" "${IDENTITY}" "${IDENTITY}" "${REVIEW_MODE}" "${HEAD_SHA}" "${BASE_SHA}" > "${body_file}"
          if ! gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -F body=@"${body_file}" >/dev/null; then
            # The edit can land with its reply lost. Read the comment back once:
            # if it now carries this run's failed marker, the verdict is published.
            sleep 5
            if after="$(gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" --jq '.body')"; then
              case "${after}" in
                *"<!-- pr-review-status:v1 state=failed identity=${IDENTITY} "*)
                  echo "pr-review phase=finalize status=closed-after-lost-reply"
                  exit 0 ;;
              esac
            fi
            echo "::error title=pr-review finalize::could not close the status comment, so it may still read running. Re-run only the finalize job to retry finalization without starting provider work. New review commands stay blocked until finalization closes the claim or the claim is 105 minutes old (the stale-claim timeout)."
            exit 1
          fi
          echo "pr-review phase=finalize status=closed"
