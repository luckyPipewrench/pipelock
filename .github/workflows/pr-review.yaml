name: AI PR Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  # Both are required. Posting a comment on a PULL REQUEST needs
  # pull-requests: write even though the call goes to the issue-comments
  # endpoint; issues: write alone covers issues only, and the comment-create
  # call returns 403. Verified live: this was reduced to read and every
  # /review in the repository failed until it was restored. Do not narrow it
  # again without running a real /review against a pull request.
  pull-requests: write
  # A called workflow cannot hold a permission its caller withheld, so this
  # must be granted HERE as well as in the reusable workflow. The completeness
  # job posts a pr-review/coverage commit status on the reviewed head, which is
  # the only surface a comment-triggered run has on the pull request. Granting
  # it in one file only means the POST 403s and the status silently never
  # appears, which is the same invisibility the status exists to remove.
  statuses: write

jobs:
  review:
    # This gate authorizes the external provider call and outbound PR-code
    # review. The reusable workflow runs only immutable Pipelock action code.
    if: >-
      github.actor == 'luckyPipewrench' &&
      github.triggering_actor == 'luckyPipewrench' &&
      github.event.comment.user.login == 'luckyPipewrench' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.issue.pull_request &&
      (github.event.comment.body == '/review' ||
       github.event.comment.body == '/review deep')
    uses: ./.github/workflows/pr-review-reusable.yaml
    with:
      pr_number: ${{ github.event.issue.number }}
      review_mode: >-
        ${{ github.event.comment.body == '/review deep' && 'deep' ||
            'default' }}
      # A same-repository reusable call resolves this workflow at github.sha.
      # External callers use an explicit full SHA in both positions instead.
      reviewer_sha: ${{ github.sha }}
    secrets:
      review_token: ${{ secrets.GITHUB_TOKEN }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
