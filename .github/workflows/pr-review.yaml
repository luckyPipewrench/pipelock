name: AI PR Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Restrict to the repository owner account. Some /review modes execute
    # code from the PR's merge ref in this workflow's secret scope, so the
    # trigger needs a permission gate beyond the comment body check.
    if: >-
      github.event.comment.user.login == 'luckyPipewrench' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.issue.pull_request &&
      (github.event.comment.body == '/review' ||
       github.event.comment.body == '/review deep' ||
       github.event.comment.body == '/review tests' ||
       github.event.comment.body == '/review docs' ||
       github.event.comment.body == '/review stats')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted review runner
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check out PR for stats mode
        if: github.event.comment.body == '/review stats'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          ref: refs/pull/${{ github.event.issue.number }}/merge
          path: pr
          persist-credentials: false

      - name: Set up Go
        if: contains(github.event.comment.body, 'stats')
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --require-hashes -r .github/requirements-pr-review.txt

      - name: Test trusted review runner
        run: python -m unittest scripts/pr_review_test.py

      - name: Determine review mode
        id: mode
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          case "$COMMENT_BODY" in
            "/review deep")  echo "mode=deep" >> "$GITHUB_OUTPUT" ;;
            "/review tests") echo "mode=tests" >> "$GITHUB_OUTPUT" ;;
            "/review docs")  echo "mode=docs" >> "$GITHUB_OUTPUT" ;;
            "/review stats") echo "mode=stats" >> "$GITHUB_OUTPUT" ;;
            *)               echo "mode=default" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run PR review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_MODE: ${{ steps.mode.outputs.mode }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          STATS_REPO_PATH: pr
          # Optional repository variables. Empty values fall back to the
          # reviewed constants in scripts/pr-review.py, the single source of
          # truth for model defaults.
          PR_REVIEW_MODEL_FAST: ${{ vars.PR_REVIEW_MODEL_FAST }}
          PR_REVIEW_MODEL_DEEP: ${{ vars.PR_REVIEW_MODEL_DEEP }}
        run: python scripts/pr-review.py
