name: Reviewer model availability probe

on:
  push:
    branches: [chore/reviewer-sol-6-1]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: false
      - name: Start mediation
        run: |
          set -euo pipefail
          go build -o "${RUNNER_TEMP}/pipelock" ./cmd/pipelock
          "${RUNNER_TEMP}/pipelock" run --config configs/balanced.yaml --listen 127.0.0.1:18888 >"${RUNNER_TEMP}/model-probe-proxy.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18888/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Proxy readiness failed' >&2
          exit 1
      - name: Verify review credential and request format
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get('OPENAI_API_KEY')
          if not key:
              raise SystemExit('Review API credential is absent')
          proxy = 'http://127.0.0.1:18888'
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({'http': proxy, 'https': proxy})
          )
          payload = {
              'model': 'gpt-6.1-sol',
              'messages': [
                  {'role': 'system', 'content': 'Return only a JSON object.'},
                  {'role': 'user', 'content': 'Return exactly {"ok":true}.'},
              ],
              'reasoning_effort': 'low',
              'max_completion_tokens': 64000,
              'response_format': {'type': 'json_object'},
          }
          request = urllib.request.Request(
              'https://api.openai.com/v1/chat/completions',
              data=json.dumps(payload).encode(),
              headers={'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json'},
          )
          try:
              with opener.open(request, timeout=180) as response:
                  status = response.status
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit('Model probe rejected: HTTP ' + str(error.code)) from None
          choice = result['choices'][0]
          if choice.get('finish_reason') != 'stop':
              raise SystemExit('Model probe did not finish')
          if json.loads(choice['message']['content']) != {'ok': True}:
              raise SystemExit('Model probe returned unexpected JSON')
          if not result.get('model', '').startswith('gpt-6.1-sol'):
              raise SystemExit('Provider returned an unexpected model')
          print(json.dumps({
              'http_status': status,
              'requested_model': payload['model'],
              'returned_model': result['model'],
              'reasoning_effort': payload['reasoning_effort'],
              'finish_reason': choice['finish_reason'],
              'json_verified': True,
          }))
          PY
