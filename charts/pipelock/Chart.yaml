apiVersion: v2
name: pipelock
description: Agent firewall for AI agents. Network scanning, process containment, and tool policy enforcement.
type: application
# The chart version tracks the Pipelock version it deploys, and the release
# gate enforces that both equal the release tag. The chart publishes to an
# OCI registry under this version as the tag, so a version that did not move
# every release would overwrite the previously published chart in place.
version: 3.6.0
appVersion: "3.6.0"
home: https://pipelab.org
sources:
  - https://github.com/luckyPipewrench/pipelock
maintainers:
  - name: Josh Waldrep
    url: https://github.com/luckyPipewrench
keywords:
  - ai-security
  - agent-firewall
  - mcp
  - dlp
  - prompt-injection
  - egress-control
icon: https://raw.githubusercontent.com/luckyPipewrench/pipelock/main/assets/pipelock-logo.svg
annotations:
  # This is the license of THE CHART, not of the application it deploys, and
  # Artifact Hub requires a single SPDX identifier here rather than an
  # expression. These templates live outside enterprise/, so NOTICE puts them
  # under Apache-2.0. The deployed image is dual-licensed and says so where a
  # consumer of the image will actually look: the org.opencontainers.image
  # labels on the image itself, and the Homebrew formula for the binary.
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changesURL: https://github.com/luckyPipewrench/pipelock/releases
  artifacthub.io/links: |
    - name: Documentation
      url: https://pipelab.org/learn/
    - name: Release notes
      url: https://github.com/luckyPipewrench/pipelock/releases
    - name: Receipt verifier (Python)
      url: https://github.com/luckyPipewrench/pipelock-verify-python
  artifacthub.io/changes: |
    - kind: changed
      description: Pipelock appVersion 3.6.0. Contained agents run in their own network namespace with declared loopback services, a VNC display viewer, browser CA trust and signed workspace change statements.
    - kind: added
      description: Credential audiences let provider, Slack, Google, GitHub, GitLab and AWS SigV4 credentials reach their own issuer while every other destination still blocks.
    - kind: added
      description: Issuer-bound session cookies, issued paging tokens, scoped JSON exceptions, core observe exceptions and path entropy exclusions reduce false blocks without host-wide exemptions.
    - kind: added
      description: pipelock explain response, verify-receipt --whole-recorder, the X-Pipelock-Receipt header and a build-provenance attestation on the published chart.
    - kind: changed
      description: Browser Shield reads HTML and CSS the way a browser does, response bodies are classified from their bytes, and compressed responses are decoded and scanned.
    - kind: changed
      description: A config file that omits fetch_proxy.monitoring.blocklist now gets the shipped blocklist, and each Pipelock process writes its own receipt chain.
    - kind: security
      description: Tool policy protected-path rules cover move, copy, rename, delete, permission and link operations, and the core DLP floor covers MCP input.
    - kind: fixed
      description: MCP, A2A, cross-request, partial-response and WebSocket paths scan content they previously skipped, and conductor rollback authorizations bind to their target stream.
