apiVersion: v2
name: pipelock
description: Agent firewall for AI agents. Network scanning, process containment, and tool policy enforcement.
type: application
version: 0.9.0
appVersion: "3.3.0"
home: https://pipelab.org
sources:
  - https://github.com/luckyPipewrench/pipelock
maintainers:
  - name: Josh Waldrep
    url: https://github.com/luckyPipewrench
keywords:
  - ai-security
  - agent-firewall
  - mcp
  - dlp
  - prompt-injection
  - egress-control
icon: https://raw.githubusercontent.com/luckyPipewrench/pipelock/main/assets/pipelock-logo.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changesURL: https://github.com/luckyPipewrench/pipelock/releases
  artifacthub.io/links: |
    - name: Documentation
      url: https://pipelab.org/learn/
    - name: Release notes
      url: https://github.com/luckyPipewrench/pipelock/releases
    - name: Audit Packet verifier
      url: https://github.com/luckyPipewrench/pipelock-verify-python
  artifacthub.io/changes: |
    - kind: changed
      description: Pipelock appVersion 3.3.0. Denial-of-wallet budgets are keyed by subject, MCP denial-of-wallet settings follow hot reload, and unversioned rule bundles degrade visibly instead of loading implicitly.
    - kind: added
      description: Opaque high-entropy egress detection, safety-reclassification response detection, receipt-chain auto-anchoring, audit-sink health metrics, and HTTP/OCSF output.
    - kind: added
      description: Encrypted Conductor durable audit queues with Helm keyring mounts and audit-queue-key lifecycle commands.
    - kind: fixed
      description: Audit Packet verification requires external trust anchors, full evidence directories no longer stop receipt emission, and Conductor leaders survive policy-hash-moving upgrades.
    - kind: fixed
      description: Opaque CONNECT can require TLS with SNI, local integrity state has explicit permission policies, matched credentials are redacted from core audit events, and containment reinstall waits for readiness.
