<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipelock Bundle Verifier</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8;
      --panel: #ffffff;
      --text: #172026;
      --muted: #5f6b73;
      --line: #d8dee3;
      --ok: #0d7a4f;
      --bad: #b42318;
      --focus: #1b6fb8;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .subhead {
      margin: 0 0 22px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: 16px;
      align-items: start;
    }
    section,
    aside {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    label {
      display: block;
      margin: 0 0 8px;
      font-weight: 650;
    }
    input[type="file"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }
    input[type="file"] {
      padding: 10px;
    }
    textarea {
      min-height: 210px;
      resize: vertical;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    button {
      border: 1px solid #125995;
      background: var(--focus);
      color: #fff;
      border-radius: 6px;
      padding: 9px 13px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled {
      border-color: var(--line);
      background: #ccd4db;
      cursor: not-allowed;
    }
    .status {
      color: var(--muted);
      min-height: 22px;
    }
    .verdict {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      font-size: 18px;
      font-weight: 800;
    }
    .verdict.valid {
      color: var(--ok);
      border-color: #92d8bd;
      background: #eefaf5;
    }
    .verdict.invalid {
      color: var(--bad);
      border-color: #f0aaa4;
      background: #fff3f1;
    }
    dl {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 6px 10px;
      margin: 0 0 14px;
    }
    dt {
      color: var(--muted);
    }
    dd {
      margin: 0;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 7px;
    }
    li {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      align-items: start;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .mark {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
    }
    .mark.pass {
      background: var(--ok);
    }
    .mark.fail {
      background: var(--bad);
    }
    .empty {
      color: var(--muted);
    }
    @media (max-width: 760px) {
      main {
        width: min(100% - 20px, 960px);
        padding-top: 18px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Pipelock Bundle Verifier</h1>
    <p class="subhead">Client-side verification for signed playground bundles.</p>
    <div class="grid">
      <section>
        <label for="bundleFile">Bundle file</label>
        <input id="bundleFile" type="file" accept=".gz,.tgz,.tar.gz,application/gzip">
        <div class="row">
          <button id="verifyFile" type="button" disabled>Verify File</button>
          <span id="fileStatus" class="status">WASM loading...</span>
        </div>
        <hr>
        <label for="bundleText">Pasted bundle</label>
        <textarea id="bundleText" spellcheck="false" placeholder="Paste base64 bundle text here"></textarea>
        <div class="row">
          <button id="verifyText" type="button" disabled>Verify Paste</button>
          <span id="textStatus" class="status"></span>
        </div>
      </section>
      <aside>
        <div id="verdict" class="verdict invalid">No Bundle</div>
        <dl>
          <dt>Run nonce</dt>
          <dd id="runNonce">-</dd>
          <dt>Observed</dt>
          <dd id="observed">-</dd>
          <dt>Error</dt>
          <dd id="errorText">-</dd>
        </dl>
        <ul id="checks">
          <li class="empty">No checks run yet.</li>
        </ul>
      </aside>
    </div>
  </main>
  <script src="out/wasm_exec.js"></script>
  <script>
    const fileInput = document.getElementById("bundleFile");
    const verifyFile = document.getElementById("verifyFile");
    const verifyText = document.getElementById("verifyText");
    const bundleText = document.getElementById("bundleText");
    const fileStatus = document.getElementById("fileStatus");
    const textStatus = document.getElementById("textStatus");
    const verdict = document.getElementById("verdict");
    const runNonce = document.getElementById("runNonce");
    const observed = document.getElementById("observed");
    const errorText = document.getElementById("errorText");
    const checks = document.getElementById("checks");

    let wasmReady = false;

    function setReady(ready, message) {
      wasmReady = ready;
      verifyFile.disabled = !ready || fileInput.files.length === 0;
      verifyText.disabled = !ready || bundleText.value.trim() === "";
      fileStatus.textContent = message;
    }

    async function loadWasm() {
      try {
        const go = new Go();
        const response = await fetch("out/pipelock-verifier.wasm");
        if (!response.ok) {
          throw new Error("missing out/pipelock-verifier.wasm");
        }
        const bytes = await response.arrayBuffer();
        const result = await WebAssembly.instantiate(bytes, go.importObject);
        go.run(result.instance);
        setReady(true, "Ready");
      } catch (err) {
        setReady(false, err.message);
      }
    }

    function render(result) {
      const valid = Boolean(result && result.valid);
      verdict.textContent = valid ? "VALID" : "INVALID";
      verdict.className = "verdict " + (valid ? "valid" : "invalid");
      runNonce.textContent = result && result.runNonce ? result.runNonce : "-";
      observed.textContent = result && Number.isInteger(result.observed) ? String(result.observed) : "-";
      errorText.textContent = result && result.error ? result.error : "-";
      checks.innerHTML = "";
      const list = result && Array.isArray(result.checks) ? result.checks : [];
      if (list.length === 0) {
        const item = document.createElement("li");
        item.className = "empty";
        item.textContent = "No checks returned.";
        checks.appendChild(item);
        return;
      }
      for (const check of list) {
        const item = document.createElement("li");
        const mark = document.createElement("span");
        mark.className = "mark " + (check.pass ? "pass" : "fail");
        mark.textContent = check.pass ? "OK" : "!";
        const name = document.createElement("span");
        name.textContent = check.name || "unnamed-check";
        item.append(mark, name);
        checks.appendChild(item);
      }
    }

    fileInput.addEventListener("change", () => {
      verifyFile.disabled = !wasmReady || fileInput.files.length === 0;
      fileStatus.textContent = fileInput.files.length ? fileInput.files[0].name : "Ready";
    });

    bundleText.addEventListener("input", () => {
      verifyText.disabled = !wasmReady || bundleText.value.trim() === "";
      textStatus.textContent = "";
    });

    verifyFile.addEventListener("click", async () => {
      if (!fileInput.files.length) return;
      fileStatus.textContent = "Verifying...";
      const data = new Uint8Array(await fileInput.files[0].arrayBuffer());
      render(globalThis.pipelockVerifyBundle(data));
      fileStatus.textContent = "Done";
    });

    verifyText.addEventListener("click", () => {
      textStatus.textContent = "Verifying...";
      render(globalThis.pipelockVerifyBundle(bundleText.value));
      textStatus.textContent = "Done";
    });

    loadWasm();
  </script>
</body>
</html>
