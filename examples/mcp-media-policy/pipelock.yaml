# MCP media-policy example.
# Defaults already strip audio/video and image metadata; this makes them explicit
# and disables competing MCP layers so outcomes prove media_policy only.

version: 1
mode: balanced

internal: []

ssrf:
  ip_allowlist:
    - "127.0.0.1/32"

dlp:
  scan_env: false
  include_defaults: false

response_scanning:
  enabled: false
  action: warn

mcp_input_scanning:
  enabled: false
  action: warn

mcp_tool_scanning:
  enabled: false
  action: warn
  detect_drift: false

mcp_session_binding:
  enabled: false

mcp_tool_policy:
  enabled: false

media_policy:
  enabled: true
  strip_image_metadata: true
  strip_audio: true
  strip_video: true
  strip_images: false
  allowed_image_types:
    - image/jpeg
    - image/png
